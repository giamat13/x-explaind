<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>איך אוזניות מבטלות רעשים?</title>
<style>
  :root {
    --bg: #0b1330;
    --panel: #111c44;
    --ink: #eef2ff;
    --muted: #9fb0e8;
    --coral: #ff6b6b;
    --sky: #4dd2ff;
    --amber: #ffc44d;
    --mint: #6ef3c5;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #top {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px 0;
    pointer-events: none;
  }
  #top h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
  #top p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  .lbl {
    position: fixed; left: 0; top: 0; display: flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: rgba(11, 19, 48, .78); pointer-events: none; white-space: nowrap; will-change: transform;
  }
  .lbl i { width: 9px; height: 9px; border-radius: 50%; display: block; }
  .lbl[hidden] { display: none; }

  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--panel);
    border-radius: 22px 22px 0 0;
    padding: 14px 18px calc(env(safe-area-inset-bottom, 0px) + 14px);
    box-shadow: 0 -10px 30px rgba(0, 0, 0, .35);
  }
  #dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
  #dots i { width: 22px; height: 6px; border-radius: 3px; background: #2b3a78; display: block; transition: background .2s, width .2s; }
  #dots i.done { background: #4a5db0; }
  #dots i.on { background: var(--amber); width: 34px; }

  #mid { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  #diagram { flex: none; width: 124px; }
  #diagram svg { width: 100%; height: auto; display: block; background: rgba(255,255,255,.04); border-radius: 12px; }
  #meter { flex: 1; min-width: 0; }
  #mlabel { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  #mbar { direction: ltr; position: relative; height: 16px; border-radius: 8px; background: #1d2b6a; overflow: hidden; }
  #mfill { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; border-radius: 8px; background: var(--amber); }
  #mmark { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: #fff; }
  #mticks { direction: ltr; position: relative; height: 18px; margin-top: 5px; font-size: 12px; color: var(--muted); }
  #mticks span { position: absolute; top: 0; white-space: nowrap; }
  #mticks .a { left: 0; }
  #mticks .b { left: 50%; transform: translateX(-50%); color: var(--ink); }
  #mnum { font-size: 26px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }

  #cap { margin: 0 0 12px; font-size: 16px; line-height: 1.55; min-height: 4.7em; }
  #slidelabel { font-size: 14px; color: var(--muted); margin: 0 0 2px; }
  #slidewrap { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; direction: ltr; font-size: 14px; }
  #slidewrap[hidden], #slidelabel[hidden] { display: none; }
  #delayRange { flex: 1; accent-color: var(--sky); height: 32px; }

  #btns { display: flex; gap: 10px; }
  #btns button {
    flex: 1; min-height: 54px; border: 0; border-radius: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #prev { background: #22307a; }
  #next { background: var(--sky); }
  #btns button:disabled { opacity: .3; cursor: default; }
  #btns button:focus-visible, #delayRange:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  #btns button:active:not(:disabled) { transform: scale(.97); }

  @media (prefers-reduced-motion: reduce) { #dots i { transition: none; } }
  @media (min-width: 700px) {
    #sheet { left: 50%; right: auto; width: 520px; transform: translateX(-50%); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <h1>איך אוזניות מבטלות רעשים?</h1>
  <p>גררו כדי לסובב את התצוגה, צבטו כדי לעשות זום.</p>
</div>

<div class="lbl" id="l0"><i style="background:#ff6b6b"></i><span>רעש מבחוץ</span></div>
<div class="lbl" id="l1" hidden><i style="background:#4dd2ff"></i><span>אנטי־רעש</span></div>
<div class="lbl" id="l2" hidden><i style="background:#6ef3c5"></i><span>מה שנשמע באוזן</span></div>
<div class="lbl" id="l3" hidden><i style="background:#fff"></i><span>האוזן</span></div>

<div id="sheet">
  <div id="dots"></div>
  <div id="mid">
    <div id="diagram"></div>
    <div id="meter">
      <div id="mlabel">עוצמת הרעש באוזן</div>
      <div id="mbar"><div id="mfill"></div><div id="mmark"></div></div>
      <div id="mticks"><span class="a">שקט</span><span class="b">בלי ביטול רעשים</span></div>
      <div id="mnum">100%</div>
    </div>
  </div>
  <p id="cap"></p>
  <div id="slidelabel" hidden>עיכוב האנטי־רעש: גררו כדי לשנות</div>
  <div id="slidewrap" hidden>
    <span>בזמן</span>
    <input id="delayRange" type="range" min="0" max="0.5" step="0.005" value="0.12" aria-label="עיכוב האנטי־רעש">
    <span>מאחר</span>
  </div>
  <div id="btns">
    <button id="prev" type="button" aria-label="הקודם">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#eef2ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button id="next" type="button" aria-label="הבא">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#06153a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var canvas = document.getElementById('c');
  var sheet = document.getElementById('sheet');
  var dotsEl = document.getElementById('dots');
  var diagramEl = document.getElementById('diagram');
  var capEl = document.getElementById('cap');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var slideWrap = document.getElementById('slidewrap');
  var slideLabel = document.getElementById('slidelabel');
  var delayRange = document.getElementById('delayRange');
  var mfill = document.getElementById('mfill');
  var mnum = document.getElementById('mnum');
  var labels = [0, 1, 2, 3].map(function (i) { return document.getElementById('l' + i); });

  var TEXTS = [
    'רעש מבחוץ, כמו מנוע או מזגן, הוא גל של לחץ אוויר. הוא מגיע אל האוזן ואנחנו שומעים אותו.',
    'מיקרופון קטן בצד החיצוני של האוזנייה מקשיב לרעש ומודד אותו כל רגע. הנקודה הצהובה מראה את המדידה.',
    'השבב יוצר גל הפוך: איפה שהרעש עולה, האנטי־רעש יורד. הקווים הלבנים מראים את ההיפוך.',
    'הרמקול באוזנייה מנגן את האנטי־רעש. שני הגלים נפגשים ומקזזים זה את זה, והגל הירוק כמעט שטוח: כמעט שקט.',
    'התזמון קריטי. אם האנטי־רעש מאחר, הביטול נחלש. בעיכוב של חצי מחזור הוא אפילו מגביר את הרעש. גררו את המחוון.',
    'זה עובד הכי טוב על רעש קבוע ונמוך, כמו מנוע. רעש פתאומי, כמו מחיאת כפיים, קשה לחזות, ולכן ממשיך להישמע.'
  ];
  var CFG = [
    { mic: false, anti: false, sum: false },
    { mic: true, anti: false, sum: false },
    { mic: true, anti: true, sum: false, links: true },
    { mic: true, anti: true, sum: true },
    { mic: true, anti: true, sum: true, slider: true },
    { mic: true, anti: true, sum: true, clap: true }
  ];

  if (!window.THREE) { capEl.textContent = 'לא ניתן לטעון את מנוע התלת־ממד. בדקו את החיבור ורעננו את הדף.'; return; }
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); }
  catch (e) { capEl.textContent = 'הדפדפן הזה לא תומך ב־WebGL.'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1330);
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  var dl = new THREE.DirectionalLight(0xffffff, 0.9);
  dl.position.set(4, 8, 10);
  scene.add(dl);

  var root = new THREE.Group();
  var world = new THREE.Group();
  world.position.y = -2.5;
  root.add(world);
  scene.add(root);

  /* wave setup */
  var L = 10, N = 130, K = 1.5, W = 3.2, PERIOD = 2 * Math.PI / W;
  var ROW = { noise: 3.2, anti: 0.4, sum: -2.4 };
  var CSS = { noise: 0xff6b6b, anti: 0x4dd2ff, sum: 0x6ef3c5 };

  function hum(x, t) { return 0.75 * (Math.sin(K * x - W * t) + 0.35 * Math.sin(2.6 * K * x - 1.7 * W * t + 1.0)); }

  function circleTex() {
    var cv = document.createElement('canvas');
    cv.width = cv.height = 64;
    var g = cv.getContext('2d');
    var gr = g.createRadialGradient(32, 32, 0, 32, 32, 30);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.55, 'rgba(255,255,255,.9)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(cv);
  }
  var tex = circleTex();

  function makeCurve(y0, color) {
    var pos = new THREE.BufferAttribute(new Float32Array(N * 3), 3);
    var lg = new THREE.BufferGeometry(); lg.setAttribute('position', pos);
    var line = new THREE.Line(lg, new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.85 }));
    var pg = new THREE.BufferGeometry(); pg.setAttribute('position', pos);
    var pts = new THREE.Points(pg, new THREE.PointsMaterial({
      color: color, size: 0.42, map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    line.frustumCulled = false; pts.frustumCulled = false;
    world.add(line, pts);
    return { y0: y0, pos: pos, line: line, pts: pts, vals: new Float32Array(N) };
  }
  var cNoise = makeCurve(ROW.noise, CSS.noise);
  var cAnti = makeCurve(ROW.anti, CSS.anti);
  var cSum = makeCurve(ROW.sum, CSS.sum);

  function xAt(i) { return -L / 2 + L * i / (N - 1); }
  function writeCurve(c) {
    var a = c.pos.array;
    for (var i = 0; i < N; i++) { a[i * 3] = xAt(i); a[i * 3 + 1] = c.y0 + c.vals[i]; a[i * 3 + 2] = 0; }
    c.pos.needsUpdate = true;
  }
  function setVisible(c, v) { c.line.visible = v; c.pts.visible = v; }

  /* guide line at the ear, markers, links */
  var guide = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, ROW.sum - 1.7, 0), new THREE.Vector3(0, ROW.noise + 1.9, 0)]),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.28 })
  );
  world.add(guide);

  function makeMarker(color, r) {
    var g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r, 16, 16), new THREE.MeshBasicMaterial({ color: color })));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r * 2.3, 16, 16), new THREE.MeshBasicMaterial({
      color: color, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false
    })));
    world.add(g);
    return g;
  }
  var mkNoise = makeMarker(0xffc44d, 0.24);
  var mkAnti = makeMarker(0x4dd2ff, 0.2);
  var mkSum = makeMarker(0x6ef3c5, 0.2);

  var LINKS = 13;
  var linkGeo = new THREE.BufferGeometry();
  linkGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(LINKS * 2 * 3), 3));
  var links = new THREE.LineSegments(linkGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 }));
  links.frustumCulled = false;
  world.add(links);

  /* headphones model */
  var hp = new THREE.Group();
  var matBand = new THREE.MeshLambertMaterial({ color: 0x8fa2ff });
  var matCup = new THREE.MeshLambertMaterial({ color: 0x3d52d5 });
  var matPad = new THREE.MeshLambertMaterial({ color: 0x1c2a78 });
  hp.add(new THREE.Mesh(new THREE.TorusGeometry(2.1, 0.16, 12, 48, Math.PI), matBand));
  var cupGeo = new THREE.CylinderGeometry(1, 1, 0.75, 32); cupGeo.rotateZ(Math.PI / 2);
  var padGeo = new THREE.TorusGeometry(0.85, 0.22, 12, 32); padGeo.rotateY(Math.PI / 2);
  var glowGeo = new THREE.TorusGeometry(1.3, 0.05, 8, 48); glowGeo.rotateY(Math.PI / 2);
  var glows = [];
  [-1, 1].forEach(function (sg) {
    var cup = new THREE.Mesh(cupGeo, matCup); cup.position.set(sg * 2.15, 0, 0); hp.add(cup);
    var pad = new THREE.Mesh(padGeo, matPad); pad.position.set(sg * 1.75, 0, 0); hp.add(pad);
    var mic = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffc44d }));
    mic.position.set(sg * 2.55, 0.45, 0); hp.add(mic);
    var glow = new THREE.Mesh(glowGeo, new THREE.MeshBasicMaterial({ color: 0x4dd2ff, transparent: true, opacity: 0.85 }));
    glow.position.set(sg * 2.7, 0, 0); glow.visible = false; hp.add(glow); glows.push(glow);
  });
  hp.position.set(0, 7.3, 0);
  hp.scale.setScalar(0.85);
  world.add(hp);

  /* panel diagram */
  function diagram(st) {
    var act = [['noise'], ['noise', 'mic'], ['mic', 'chip'], ['chip', 'spk', 'ear'], ['chip', 'spk', 'ear'], ['noise']][st];
    function o(n) { return act.indexOf(n) >= 0 ? 1 : 0.28; }
    var s = '';
    if (st === 5) {
      s += '<path opacity="1" d="M4 42h10l4-22 6 44 5-22h9" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
    } else {
      s += '<path opacity="' + o('noise') + '" d="M3 42q6-16 12 0t12 0t12 0" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>';
    }
    s += '<rect x="50" y="8" width="54" height="68" rx="12" fill="#1a2760" stroke="#9fb0e8" stroke-width="2"/>';
    s += '<circle cx="50" cy="26" r="5" fill="#ffc44d" opacity="' + o('mic') + '"/>';
    s += '<path d="M53 30Q60 40 68 48" fill="none" stroke="#eef2ff" stroke-width="2" opacity="' + Math.min(o('mic'), o('chip')) + '"/>';
    s += '<rect x="62" y="48" width="16" height="16" rx="3" fill="#a78bfa" opacity="' + o('chip') + '"/>';
    s += '<path d="M78 56Q84 54 88 46" fill="none" stroke="#eef2ff" stroke-width="2" opacity="' + Math.min(o('chip'), o('spk')) + '"/>';
    s += '<path d="M88 34h6l6-8v32l-6-8h-6z" fill="#4dd2ff" opacity="' + o('spk') + '"/>';
    s += '<path d="M104 32q5 10 0 20" fill="none" stroke="#4dd2ff" stroke-width="2.2" stroke-linecap="round" opacity="' + o('ear') + '"/>';
    s += '<circle cx="113" cy="42" r="5.5" fill="none" stroke="#fff" stroke-width="2.2" opacity="' + o('ear') + '"/>';
    if (st === 4) {
      s += '<g transform="translate(70 24)"><circle r="8" fill="#111c44" stroke="#ff6b6b" stroke-width="2"/><path d="M0 0L-3-5M0 0l5 3" stroke="#eef2ff" stroke-width="1.8" stroke-linecap="round"/></g>';
    }
    return '<svg viewBox="0 0 120 84" role="img" aria-label="שלב ' + (st + 1) + '">' + s + '</svg>';
  }

  /* state */
  var step = 0, delay = 0.12, time = 0, meterVal = 1;
  for (var di = 0; di < CFG.length; di++) dotsEl.appendChild(document.createElement('i'));

  function setStep(n) {
    step = Math.max(0, Math.min(CFG.length - 1, n));
    var cfg = CFG[step];
    diagramEl.innerHTML = diagram(step);
    capEl.textContent = TEXTS[step];
    Array.prototype.forEach.call(dotsEl.children, function (d, i) { d.className = i === step ? 'on' : (i < step ? 'done' : ''); });
    prevBtn.disabled = step === 0;
    nextBtn.disabled = step === CFG.length - 1;
    slideWrap.hidden = !cfg.slider;
    slideLabel.hidden = !cfg.slider;
    if (step === 4) { delay = 0.12; delayRange.value = '0.12'; }
    setVisible(cNoise, true);
    setVisible(cAnti, !!cfg.anti);
    setVisible(cSum, !!cfg.sum);
    mkNoise.visible = !!cfg.mic;
    mkAnti.visible = !!cfg.anti;
    mkSum.visible = !!cfg.sum;
    links.visible = !!cfg.links;
    guide.visible = !!cfg.mic;
    glows.forEach(function (g) { g.visible = !!cfg.sum; });
    labels[1].hidden = !cfg.anti;
    labels[2].hidden = !cfg.sum;
    labels[3].hidden = !cfg.mic;
    layout();
  }
  prevBtn.addEventListener('click', function () { setStep(step - 1); });
  nextBtn.addEventListener('click', function () { setStep(step + 1); });
  delayRange.addEventListener('input', function () { delay = parseFloat(delayRange.value) || 0; });

  /* layout */
  var zoom = 1;
  function layout() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    var aspect = w / h;
    var half = Math.tan(22.5 * Math.PI / 180);
    var dist = Math.max(17, 14.5 / (2 * half * Math.min(aspect, 1.7)));
    dist = dist / zoom;
    camera.position.set(0, 0, dist);
    camera.lookAt(0, 0, 0);
    var visibleH = 2 * half * dist;
    var sheetH = sheet.getBoundingClientRect().height;
    root.position.y = (sheetH / h) * visibleH * 0.5 - 0.02 * visibleH;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', layout);

  /* input */
  var pointers = {}, pinchStart = 0, zoomStart = 1, lastInteract = 0;
  var userY = -0.45, userX = 0.12;
  function pDist() {
    var ks = Object.keys(pointers);
    var p1 = pointers[ks[0]], p2 = pointers[ks[1]];
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }
  canvas.addEventListener('pointerdown', function (e) {
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    if (Object.keys(pointers).length === 2) { pinchStart = pDist(); zoomStart = zoom; }
    lastInteract = performance.now();
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    lastInteract = performance.now();
    var n = Object.keys(pointers).length;
    if (n === 1) {
      userY = Math.max(-1.3, Math.min(1.3, userY + dx * 0.008));
      userX = Math.max(-0.6, Math.min(0.6, userX + dy * 0.006));
    } else if (n >= 2 && pinchStart > 0) {
      zoom = Math.max(0.6, Math.min(2.2, zoomStart * pDist() / pinchStart));
      layout();
    }
  });
  function up(e) {
    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) pinchStart = 0;
    lastInteract = performance.now();
  }
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoom = Math.max(0.6, Math.min(2.2, zoom * (e.deltaY < 0 ? 1.08 : 0.92)));
    layout();
  }, { passive: false });

  /* labels */
  var v3 = new THREE.Vector3();
  function place(lbl, x, y) {
    if (lbl.hidden) return;
    v3.set(x, y, 0);
    world.localToWorld(v3);
    v3.project(camera);
    var px = (v3.x * 0.5 + 0.5) * window.innerWidth;
    var py = (-v3.y * 0.5 + 0.5) * window.innerHeight;
    var w = lbl.offsetWidth;
    px = Math.max(6, Math.min(window.innerWidth - w - 6, px));
    lbl.style.transform = 'translate(' + px + 'px,' + py + 'px) translateY(-100%)';
  }

  /* loop */
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var last = performance.now() / 1000;
  function frame(t) {
    requestAnimationFrame(frame);
    var now = t / 1000;
    var dt = Math.min(0.05, Math.max(0.001, now - last));
    last = now; time += dt;
    var cfg = CFG[step];
    var d = step === 4 ? delay : 0;

    var xb = -L / 2 + ((time * 3.5) % (L + 8)) - 2;
    var i, x, nv, av, sumSq = 0, noiseSq = 0;
    for (i = 0; i < N; i++) {
      x = xAt(i);
      nv = hum(x, time);
      if (cfg.clap) { var u = x - xb; nv += 1.6 * Math.exp(-u * u / 0.5) * Math.cos(7 * u); }
      av = -hum(x, time - d * PERIOD);
      cNoise.vals[i] = nv;
      cAnti.vals[i] = av;
      cSum.vals[i] = nv + av;
      noiseSq += nv * nv;
      sumSq += (nv + av) * (nv + av);
    }
    writeCurve(cNoise);
    if (cfg.anti) writeCurve(cAnti);
    if (cfg.sum) writeCurve(cSum);

    var ratio = cfg.sum ? Math.sqrt(sumSq / noiseSq) : 1;
    meterVal += (ratio - meterVal) * (1 - Math.exp(-8 * dt));
    var pct = Math.round(meterVal * 100);
    mfill.style.width = Math.min(100, meterVal * 50) + '%';
    mfill.style.background = meterVal < 0.3 ? '#6ef3c5' : (meterVal < 0.85 ? '#ffc44d' : '#ff6b6b');
    mnum.textContent = pct + '%';

    /* markers at the ear (x = 0) */
    var mid = (N - 1) / 2, mi = Math.round(mid);
    mkNoise.position.set(0, ROW.noise + cNoise.vals[mi], 0);
    mkAnti.position.set(0, ROW.anti + cAnti.vals[mi], 0);
    mkSum.position.set(0, ROW.sum + cSum.vals[mi], 0);

    if (cfg.links) {
      var la = links.geometry.attributes.position.array;
      for (var j = 0; j < LINKS; j++) {
        var idx = Math.round(j * (N - 1) / (LINKS - 1));
        var lx = xAt(idx);
        la[j * 6] = lx; la[j * 6 + 1] = ROW.noise + cNoise.vals[idx]; la[j * 6 + 2] = 0;
        la[j * 6 + 3] = lx; la[j * 6 + 4] = ROW.anti + cAnti.vals[idx]; la[j * 6 + 5] = 0;
      }
      links.geometry.attributes.position.needsUpdate = true;
    }

    hp.rotation.y = reduce ? 0.4 : Math.sin(time * 0.6) * 0.55;
    var idle = performance.now() - lastInteract > 2500 && Object.keys(pointers).length === 0;
    var sway = idle && !reduce ? Math.sin(time * 0.35) * 0.12 : 0;
    root.rotation.y = userY + sway;
    root.rotation.x = userX;

    scene.updateMatrixWorld(true);
    camera.updateMatrixWorld(true);
    place(labels[0], -L / 2, ROW.noise + 1.5);
    place(labels[1], -L / 2, ROW.anti + 1.5);
    place(labels[2], -L / 2, ROW.sum + 1.5);
    place(labels[3], 0, ROW.noise + 2.3);

    renderer.render(scene, camera);
  }

  setStep(0);
  requestAnimationFrame(frame);
})();
</script>

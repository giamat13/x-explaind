<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>איך הטלפון יודע איפה אתה?</title>
<style>
  :root {
    --bg: #0b1330;
    --panel: #111c44;
    --ink: #eef2ff;
    --muted: #9fb0e8;
    --coral: #ff6b6b;
    --sky: #4dd2ff;
    --amber: #ffc44d;
    --mint: #6ef3c5;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #top {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
    display: flex; align-items: center; justify-content: space-between;
    pointer-events: none;
  }
  #top svg { display: block; }
  #gestures {
    display: flex; gap: 14px; padding: 8px 14px; border-radius: 999px;
    background: rgba(17, 28, 68, .7);
  }

  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--panel);
    border-radius: 22px 22px 0 0;
    padding: 14px 18px calc(env(safe-area-inset-bottom, 0px) + 14px);
    box-shadow: 0 -10px 30px rgba(0, 0, 0, .35);
  }
  #dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
  #dots i { width: 22px; height: 6px; border-radius: 3px; background: #2b3a78; display: block; transition: background .2s, width .2s; }
  #dots i.done { background: #4a5db0; }
  #dots i.on { background: var(--amber); width: 34px; }
  #mid { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  #diagram { flex: none; width: 124px; }
  #diagram svg { width: 100%; height: auto; display: block; background: rgba(255,255,255,.04); border-radius: 12px; }
  #barswrap { flex: 1; min-width: 0; }
  #barlabel { font-size: 13px; line-height: 1.35; color: var(--muted); margin-bottom: 8px; min-height: 1.35em; }
  #cap { margin: 0 0 12px; font-size: 16px; line-height: 1.55; min-height: 4.7em; }
  #slidelabel { font-size: 14px; color: var(--muted); margin: 0 0 4px; }
  #slidelabel[hidden] { display: none; }
  #hint {
    position: fixed; left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 64px);
    margin: 0; padding: 0 18px; font-size: 14px; color: var(--muted); pointer-events: none;
  }
  #hint b { color: var(--ink); font-size: 18px; font-weight: 800; display: block; margin-bottom: 2px; }

  #bars { display: flex; flex-direction: column; gap: 9px; margin: 0 4px 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row .sat { width: 14px; height: 14px; flex: none; transform: rotate(45deg); border-radius: 3px; }
  .row .lane { flex: 1; position: relative; height: 14px; }
  .track {
    position: absolute; right: 0; top: 3px; height: 8px; border-radius: 4px;
    border: 1.5px solid; box-sizing: border-box; overflow: visible;
  }
  .fill { position: absolute; right: 0; top: 0; bottom: 0; border-radius: 3px; }
  .lamp {
    position: absolute; left: -8px; top: -5px; width: 14px; height: 14px; border-radius: 50%;
    box-sizing: border-box; border: 2px solid #fff; background: var(--panel);
  }
  .lamp.lit { background: #fff; box-shadow: 0 0 10px #fff; }

  #slidewrap { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; direction: ltr; }
  #slidewrap[hidden] { display: none; }
  #slidewrap svg { flex: none; }
  #errRange { flex: 1; accent-color: var(--coral); height: 32px; }

  #btns { display: flex; gap: 10px; }
  #btns button {
    flex: 1; min-height: 54px; border: 0; border-radius: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #prev { background: #22307a; }
  #next { background: var(--sky); }
  #btns button:disabled { opacity: .3; cursor: default; }
  #btns button:focus-visible, #errRange:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  #btns button:active:not(:disabled) { transform: scale(.97); }

  .flow { stroke-dasharray: 5 5; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } #dots i { transition: none; } }

  @media (min-width: 700px) {
    #sheet { left: 50%; right: auto; width: 520px; transform: translateX(-50%); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="gestures">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9fb0e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="גרירה לסיבוב">
      <path d="M4 12a8 8 0 0 1 14-5.3"/><path d="M18.5 3v4h-4"/><path d="M20 12a8 8 0 0 1-14 5.3"/><path d="M5.5 21v-4h4"/>
    </svg>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9fb0e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="צביטה לזום">
      <path d="M14 10l6-6"/><path d="M15 4h5v5"/><path d="M10 14l-6 6"/><path d="M9 20H4v-5"/>
    </svg>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9fb0e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="הקשה להזזת המיקום">
      <circle cx="12" cy="12" r="2.2" fill="#9fb0e8"/><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5"/>
    </svg>
  </div>
  <svg width="40" height="40" viewBox="0 0 40 40" fill="none" role="img" aria-label="GPS">
    <rect x="4" y="12" width="14" height="24" rx="3.5" stroke="#eef2ff" stroke-width="2.2"/>
    <circle cx="11" cy="31" r="1.5" fill="#eef2ff"/>
    <g transform="translate(29 11) rotate(45)"><rect x="-4.5" y="-4.5" width="9" height="9" rx="1.5" fill="#ffc44d"/></g>
    <path d="M22 20a10 10 0 0 0 5 8" stroke="#4dd2ff" stroke-width="2" stroke-linecap="round"/>
    <path d="M25 17a14 14 0 0 0 7 12" stroke="#4dd2ff" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  </svg>
</div>

<p id="hint"><b>איך הטלפון יודע איפה אתה?</b>גררו לסיבוב, צבטו לזום, הקישו על כדור הארץ כדי להזיז את המיקום.</p>

<div id="sheet">
  <div id="dots"></div>
  <div id="mid">
    <div id="diagram"></div>
    <div id="barswrap">
      <div id="barlabel"></div>
      <div id="bars"></div>
    </div>
  </div>
  <p id="cap"></p>
  <div id="slidelabel" hidden>שגיאת שעון בטלפון: גררו כדי לשנות</div>
  <div id="slidewrap" hidden>
    <svg id="clockOk" width="34" height="34" viewBox="0 0 34 34" fill="none" role="img" aria-label="שעון מדויק">
      <circle cx="17" cy="17" r="14" stroke="#6ef3c5" stroke-width="2.5"/>
      <path d="M17 8v9h6" stroke="#eef2ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <input id="errRange" type="range" min="0" max="1.5" step="0.01" value="0.5" aria-label="שגיאת שעון בטלפון">
    <svg id="clockBad" width="34" height="34" viewBox="0 0 34 34" fill="none" role="img" aria-label="שעון לא מדויק">
      <circle cx="17" cy="17" r="14" stroke="#ff6b6b" stroke-width="2.5"/>
      <path d="M17 17L12 10M17 17l8 5" stroke="#eef2ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div id="btns">
    <button id="prev" type="button" aria-label="הקודם">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#eef2ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button id="next" type="button" aria-label="הבא">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#06153a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var canvas = document.getElementById('c');
  var dotsEl = document.getElementById('dots');
  var diagramEl = document.getElementById('diagram');
  var barsEl = document.getElementById('bars');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var slideWrap = document.getElementById('slidewrap');
  var errRange = document.getElementById('errRange');
  var sheet = document.getElementById('sheet');
  var capEl = document.getElementById('cap');
  var barLabel = document.getElementById('barlabel');
  var slideLabel = document.getElementById('slidelabel');

  var TEXTS = [
    'כל לוויין משדר את השעה המדויקת שלו. האות נע במהירות האור, אז אות מלוויין רחוק מגיע מאוחר יותר. ההפרש בזמן הוא המרחק.',
    'מרחק מלוויין אחד אומר שאתם נמצאים איפשהו על מעגל אחד על פני כדור הארץ. איפה בדיוק על המעגל? עדיין לא ידוע.',
    'שני לוויינים נותנים שני מעגלים, והם נחתכים בשתי נקודות בלבד. אתם באחת מהן.',
    'לוויין שלישי מסיים את העבודה: רק נקודה אחת מתאימה לשלושת המרחקים. זה המיקום שלכם, והוא מסומן בלבן.',
    'השעון בטלפון לא מדויק. סטייה של מיקרו־שנייה אחת מזיזה את התוצאה בכ־300 מטר. גררו את המחוון ותראו איך המעגלים מפספסים.',
    'עם לוויין רביעי הטלפון מחשב גם את שגיאת השעון ומתקן אותה. אז כל המעגלים נפגשים בנקודה אחת: אתם.'
  ];
  var BAR_TEXTS = [
    'כמה זמן האות נוסע מכל לוויין (פס ארוך = לוויין רחוק)',
    'זמן הנסיעה של האות מהלוויין',
    'זמן הנסיעה מכל אחד משני הלוויינים',
    'זמן הנסיעה מכל אחד משלושת הלוויינים',
    'שעון לא מדויק מאריך את כל הזמנים באותה מידה',
    'ארבעה לוויינים: הטלפון מתקן את השעון'
  ];

  if (!window.THREE) { return; }
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  } catch (e) { return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var R = 5, RS = 11, TAU = Math.PI * 2;
  var COLORS = [0xff6b6b, 0x4dd2ff, 0xffc44d, 0x6ef3c5];
  var CSS = ['#ff6b6b', '#4dd2ff', '#ffc44d', '#6ef3c5'];

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1330);
  var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 300);
  var zoom = 1, camDist = 40;

  var root = new THREE.Group();
  scene.add(root);

  (function () {
    var n = 260, arr = new Float32Array(n * 3);
    for (var i = 0; i < n; i++) {
      var v = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(90 + Math.random() * 40);
      arr[i * 3] = v.x; arr[i * 3 + 1] = v.y; arr[i * 3 + 2] = v.z;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8fa2ff, size: 0.5, sizeAttenuation: true })));
  })();

  var earth = new THREE.Mesh(new THREE.SphereGeometry(R, 48, 32), new THREE.MeshBasicMaterial({ color: 0x14306b }));
  root.add(earth);
  root.add(new THREE.LineSegments(
    new THREE.WireframeGeometry(new THREE.SphereGeometry(R * 1.003, 24, 16)),
    new THREE.LineBasicMaterial({ color: 0x3a63c4, transparent: true, opacity: 0.35 })
  ));

  /* satellites: dodecahedron layout */
  var phi = (1 + Math.sqrt(5)) / 2, ip = 1 / phi, satPos = [], sgn = [-1, 1];
  for (var a1 = 0; a1 < 2; a1++) for (var a2 = 0; a2 < 2; a2++) for (var a3 = 0; a3 < 2; a3++)
    satPos.push(new THREE.Vector3(sgn[a1], sgn[a2], sgn[a3]));
  for (var b1 = 0; b1 < 2; b1++) for (var b2 = 0; b2 < 2; b2++) {
    satPos.push(new THREE.Vector3(0, sgn[b1] * ip, sgn[b2] * phi));
    satPos.push(new THREE.Vector3(sgn[b1] * ip, sgn[b2] * phi, 0));
    satPos.push(new THREE.Vector3(sgn[b1] * phi, 0, sgn[b2] * ip));
  }
  var satGeo = new THREE.OctahedronGeometry(0.38);
  var satMeshes = [];
  satPos.forEach(function (p) {
    p.normalize().multiplyScalar(RS);
    var m = new THREE.Mesh(satGeo, new THREE.MeshBasicMaterial({ color: 0x4b5a9c }));
    m.position.copy(p);
    root.add(m);
    satMeshes.push(m);
  });

  var userDir = new THREE.Vector3(0.35, 0.55, 0.75).normalize();
  var marker = new THREE.Group();
  marker.add(new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff })));
  var markerHalo = new THREE.Mesh(
    new THREE.SphereGeometry(0.6, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  marker.add(markerHalo);
  marker.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 1.8)]),
    new THREE.LineBasicMaterial({ color: 0xffffff })
  ));
  root.add(marker);

  var ringGeo = new THREE.TorusGeometry(1, 0.014, 8, 128);
  var rings = [], spokes = [], pulses = [], tracks = [];
  for (var k = 0; k < 4; k++) {
    var rm = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: COLORS[k] }));
    rm.visible = false; root.add(rm); rings.push(rm);

    var sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(32 * 2 * 3), 3));
    var sp = new THREE.LineSegments(sg, new THREE.LineBasicMaterial({ color: COLORS[k], transparent: true, opacity: 0.22 }));
    sp.frustumCulled = false; sp.visible = false; root.add(sp); spokes.push(sp);

    var pm = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), new THREE.MeshBasicMaterial({ color: COLORS[k] }));
    pm.visible = false; root.add(pm); pulses.push(pm);

    var tg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    var tl = new THREE.Line(tg, new THREE.LineBasicMaterial({ color: COLORS[k], transparent: true, opacity: 0.5 }));
    tl.frustumCulled = false; tl.visible = false; root.add(tl); tracks.push(tl);
  }

  /* ---------- graphic panel ---------- */
  var CFG = [
    { pulses: 4, rings: 0 },
    { pulses: 1, rings: 1 },
    { pulses: 2, rings: 2 },
    { pulses: 3, rings: 3 },
    { pulses: 3, rings: 3, slider: true },
    { pulses: 4, rings: 4 }
  ];

  function circ(cx, cy, r, col) {
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r.toFixed(1) + '" fill="none" stroke="' + col + '" stroke-width="2.5"/>';
  }
  function circlesThrough(centers, P, extra, n) {
    var s = '';
    for (var i = 0; i < n; i++) {
      var c = centers[i];
      var r = Math.hypot(c[0] - P[0], c[1] - P[1]) + extra;
      s += circ(c[0], c[1], r, CSS[i]);
    }
    return s;
  }
  function clockIcon(x, y, bad) {
    var hands = bad
      ? '<path d="M0 0L-4 -8M0 0l7 4" stroke="#eef2ff" stroke-width="2" stroke-linecap="round"/>'
      : '<path d="M0 -8V0h6" stroke="#eef2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
    return '<g transform="translate(' + x + ' ' + y + ')"><circle r="11" fill="#111c44" stroke="' + (bad ? '#ff6b6b' : '#6ef3c5') + '" stroke-width="2.2"/>' + hands + '</g>';
  }
  var CEN = [[44, 30], [78, 34], [58, 68], [92, 66]];
  var P = [60, 44];
  var dot = '<circle cx="60" cy="44" r="4.5" fill="#fff"/><circle cx="60" cy="44" r="9" fill="#fff" opacity=".25"/>';

  var DIAGRAMS = [
    /* 0: signal travels from satellite to phone */
    '<line class="flow" x1="92" y1="24" x2="34" y2="60" stroke="#ffc44d" stroke-width="2.5" stroke-linecap="round"/>' +
    '<g transform="translate(98 20) rotate(45)"><rect x="-8" y="-8" width="16" height="16" rx="3" fill="#ffc44d"/></g>' +
    '<rect x="14" y="46" width="22" height="34" rx="5" fill="none" stroke="#eef2ff" stroke-width="2.5"/>' +
    '<circle cx="25" cy="73" r="2" fill="#eef2ff"/>' +
    clockIcon(58, 20, false),
    /* 1: one circle, dot roams */
    circ(60, 42, 30, CSS[0]) +
    '<circle r="5.5" fill="#fff"><animateMotion dur="3.2s" repeatCount="indefinite" path="M 90 42 A 30 30 0 1 1 30 42 A 30 30 0 1 1 90 42"/></circle>' +
    '<g transform="translate(60 42) rotate(45)"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#ff6b6b"/></g>',
    /* 2: two circles, two crossings */
    circ(46, 42, 26, CSS[0]) + circ(74, 42, 26, CSS[1]) +
    '<circle cx="60" cy="19.5" r="5" fill="#fff"/><circle cx="60" cy="64.5" r="5" fill="#fff"/>',
    /* 3: three circles, one point */
    circlesThrough(CEN, P, 0, 3) + dot,
    /* 4: three circles miss because the clock is wrong */
    circlesThrough(CEN, P, 6, 3) + clockIcon(104, 16, true),
    /* 5: four circles meet, clock fixed */
    circlesThrough(CEN, P, 0, 4) + dot + clockIcon(104, 16, false) +
    '<path d="M98 16l4 4 8-9" stroke="#6ef3c5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(-2 20)"/>'
  ];

  var rowEls = [];
  for (var q = 0; q < 4; q++) {
    var row = document.createElement('div');
    row.className = 'row';
    var sat = document.createElement('div');
    sat.className = 'sat'; sat.style.background = CSS[q];
    var lane = document.createElement('div');
    lane.className = 'lane';
    var track = document.createElement('div');
    track.className = 'track'; track.style.borderColor = CSS[q];
    var fill = document.createElement('div');
    fill.className = 'fill'; fill.style.background = CSS[q];
    var lamp = document.createElement('div');
    lamp.className = 'lamp';
    track.appendChild(fill); track.appendChild(lamp);
    lane.appendChild(track);
    row.appendChild(sat); row.appendChild(lane);
    barsEl.appendChild(row);
    rowEls.push({ row: row, track: track, fill: fill, lamp: lamp });
  }

  var chosen = [0, 1, 2, 3];
  var step = 0, err = 0, errTween = null, time = 0;

  function angleTo(v) { return Math.acos(Math.max(-1, Math.min(1, v.clone().normalize().dot(userDir)))); }

  function pickSats() {
    var idx = satPos.map(function (_, i) { return i; });
    idx.sort(function (i, j) { return angleTo(satPos[i]) - angleTo(satPos[j]); });
    chosen = idx.slice(0, 4);
    var cs = {};
    chosen.forEach(function (ci, k) { cs[ci] = k; });
    satMeshes.forEach(function (m, i) {
      if (cs[i] !== undefined) { m.material.color.setHex(COLORS[cs[i]]); m.scale.setScalar(1.6); }
      else { m.material.color.setHex(0x4b5a9c); m.scale.setScalar(1); }
    });
  }

  function userPos() { return userDir.clone().multiplyScalar(R); }
  function updateMarker() {
    marker.position.copy(userPos());
    marker.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), userDir);
  }

  var zAxis = new THREE.Vector3(0, 0, 1);
  function updateGeometry() {
    var U = userPos();
    for (var k = 0; k < 4; k++) {
      var S = satPos[chosen[k]];
      var s = S.clone().normalize();
      var d = S.distanceTo(U) + err * 2.2;
      var cosg = (RS * RS + R * R - d * d) / (2 * RS * R);
      var ok = Math.abs(cosg) <= 1;
      rings[k].userData.ok = ok;
      spokes[k].userData.ok = ok;
      if (ok) {
        var g = Math.acos(cosg);
        var Rp = R * 1.012;
        var c = s.clone().multiplyScalar(Rp * Math.cos(g));
        var r = Rp * Math.sin(g);
        rings[k].position.copy(c);

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>איך חור שחור מעקם אור?</title>
<style>
  :root {
    --bg: #070a1f;
    --panel: #111c44;
    --ink: #eef2ff;
    --muted: #9fb0e8;
    --amber: #ffc44d;
    --sky: #4dd2ff;
    --red: #ff5a5a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #top {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px 0;
    pointer-events: none;
  }
  #top h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
  #top p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  .lbl {
    position: fixed; left: 0; top: 0; padding: 3px 10px; border-radius: 999px;
    font-size: 13px; font-weight: 600; background: rgba(7, 10, 31, .8);
    pointer-events: none; white-space: nowrap; will-change: transform;
  }
  .lbl[hidden] { display: none; }

  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--panel);
    border-radius: 22px 22px 0 0;
    padding: 14px 18px calc(env(safe-area-inset-bottom, 0px) + 14px);
    box-shadow: 0 -10px 30px rgba(0, 0, 0, .4);
  }
  #dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
  #dots i { width: 22px; height: 6px; border-radius: 3px; background: #2b3a78; display: block; transition: background .2s, width .2s; }
  #dots i.done { background: #4a5db0; }
  #dots i.on { background: var(--amber); width: 34px; }

  #mid { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  #diagram { flex: none; width: 124px; }
  #diagram svg { width: 100%; height: auto; display: block; background: rgba(255,255,255,.04); border-radius: 12px; }
  #diagram text { font-family: inherit; }
  #info { flex: 1; min-width: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
  #info .big { font-size: 26px; font-weight: 800; color: var(--ink); line-height: 1.15; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  #info .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  #info .chip { width: 12px; height: 12px; border-radius: 50%; flex: none; display: block; }
  #info .dash { width: 22px; height: 0; border-top: 2px dashed #9fb0e8; flex: none; display: block; }
  #info .solid { width: 22px; height: 0; border-top: 3px solid #4dd2ff; flex: none; display: block; }

  #cap { margin: 0 0 12px; font-size: 16px; line-height: 1.55; min-height: 6.2em; }
  #slidelabel { font-size: 14px; color: var(--muted); margin: 0 0 2px; }
  #slidewrap { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; direction: ltr; font-size: 14px; }
  #slidewrap[hidden], #slidelabel[hidden] { display: none; }
  #slider { flex: 1; accent-color: var(--amber); height: 32px; }

  #btns { display: flex; gap: 10px; }
  #btns button {
    flex: 1; min-height: 54px; border: 0; border-radius: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #prev { background: #22307a; }
  #next { background: var(--sky); }
  #btns button:disabled { opacity: .3; cursor: default; }
  #btns button:focus-visible, #slider:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  #btns button:active:not(:disabled) { transform: scale(.97); }

  @media (prefers-reduced-motion: reduce) { #dots i { transition: none; } }
  @media (min-width: 700px) {
    #sheet { left: 50%; right: auto; width: 520px; transform: translateX(-50%); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <h1>איך חור שחור מעקם אור?</h1>
  <p>גררו כדי לסובב את התצוגה, צבטו כדי לעשות זום.</p>
</div>

<div class="lbl" id="l0">חור שחור</div>
<div class="lbl" id="l1" hidden>כוכב רחוק</div>
<div class="lbl" id="l2" hidden>הצופה</div>
<div class="lbl" id="l3" hidden>קרני אור</div>
<div class="lbl" id="l4" hidden>יריעת המרחב־זמן</div>

<div id="sheet">
  <div id="dots"></div>
  <div id="mid">
    <div id="diagram"></div>
    <div id="info"></div>
  </div>
  <p id="cap"></p>
  <div id="slidelabel" hidden></div>
  <div id="slidewrap" hidden>
    <span id="sl0"></span>
    <input id="slider" type="range" min="0" max="1" step="0.01" value="0.5">
    <span id="sl1"></span>
  </div>
  <div id="btns">
    <button id="prev" type="button" aria-label="הקודם">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#eef2ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button id="next" type="button" aria-label="הבא">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#06153a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var canvas = document.getElementById('c');
  var sheet = document.getElementById('sheet');
  var dotsEl = document.getElementById('dots');
  var diagramEl = document.getElementById('diagram');
  var infoEl = document.getElementById('info');
  var capEl = document.getElementById('cap');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var slideWrap = document.getElementById('slidewrap');
  var slideLabel = document.getElementById('slidelabel');
  var slider = document.getElementById('slider');
  var sl0 = document.getElementById('sl0');
  var sl1 = document.getElementById('sl1');
  var labelEls = [0, 1, 2, 3, 4].map(function (i) { return document.getElementById('l' + i); });

  var TEXTS = [
    'מסה מעקמת את המרחב־זמן, כמו כדור כבד על יריעה גמישה. ככל שהמסה גדולה יותר, הבור עמוק יותר. גררו את המחוון כדי לשנות את המסה.',
    'אור נע בקו ישר, אבל כשהמרחב עצמו מעוקם, המסלול מתעקם לכיוון המסה. קרניים שעוברות קרוב יותר לחור השחור מתעקמות חזק יותר.',
    'קרוב מספיק והאור כבר לא בורח. ליד החור השחור הוא מסתובב סביבו, ומתוך אופק האירועים (הכדור השחור) הוא נופל פנימה ונעלם. הקרניים האדומות נבלעות.',
    'כוונו את הקרן: המחוון קובע כמה קרוב היא עוברת לחור השחור. יש שלושה מצבים: נבלעת, מקיפה ובורחת, או בורחת ומתעקמת.',
    'ומה רואים מהצד השני? האור של כוכב שנמצא מאחורי החור השחור מתעקם לכל הכיוונים ומגיע אלינו כטבעת זוהרת סביבו.'
  ];

  if (!window.THREE) { capEl.textContent = 'לא ניתן לטעון את מנוע התלת־ממד. בדקו את החיבור ורעננו את הדף.'; return; }
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); }
  catch (e) { capEl.textContent = 'הדפדפן הזה לא תומך ב־WebGL.'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070a1f);
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);

  var root = new THREE.Group();
  scene.add(root);
  var rayWorld = new THREE.Group();     // rays and lens objects (rotates in portrait)
  var gridGroup = new THREE.Group();    // spacetime sheet
  var holeGroup = new THREE.Group();    // the black hole itself
  root.add(gridGroup, rayWorld, holeGroup);

  var TAU = Math.PI * 2;
  var RFAR = 13;

  function circleTex() {
    var cv = document.createElement('canvas');
    cv.width = cv.height = 64;
    var g = cv.getContext('2d');
    var gr = g.createRadialGradient(32, 32, 0, 32, 32, 30);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.55, 'rgba(255,255,255,.9)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(cv);
  }
  var tex = circleTex();

  /* stars backdrop */
  (function () {
    var n = 320, arr = new Float32Array(n * 3);
    for (var i = 0; i < n; i++) {
      var v = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(120 + Math.random() * 60);
      arr[i * 3] = v.x; arr[i * 3 + 1] = v.y; arr[i * 3 + 2] = v.z;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8fa2ff, size: 0.7, sizeAttenuation: true })));
  })();

  /* ---------- geodesics (Schwarzschild, rs = 1) ---------- */
  function trace(b) {
    var u = 0, du = 1 / b, phi = 0, h = 0.01, pts = [], started = false, fate = 'escape', steps = 0;
    var uFar = 1 / RFAR;
    function acc(x) { return -x + 1.5 * x * x; }
    while (steps < 8000) {
      steps++;
      var k1u = du, k1d = acc(u);
      var k2u = du + h / 2 * k1d, k2d = acc(u + h / 2 * k1u);
      var k3u = du + h / 2 * k2d, k3d = acc(u + h / 2 * k2u);
      var k4u = du + h * k3d, k4d = acc(u + h * k3u);
      u += h / 6 * (k1u + 2 * k2u + 2 * k3u + k4u);
      du += h / 6 * (k1d + 2 * k2d + 2 * k3d + k4d);
      phi += h;
      if (u >= 1) {
        pts.push(new THREE.Vector3(-Math.cos(phi), Math.sin(phi), 0));
        fate = 'capture'; break;
      }
      if (u >= uFar) started = true;
      if (started) {
        var r = 1 / Math.max(u, 1e-6);
        if (steps % 3 === 0 || u < uFar) pts.push(new THREE.Vector3(-r * Math.cos(phi), r * Math.sin(phi), 0));
        if (u < uFar && phi > 1.2) break;
      }
      if (phi > 3 * Math.PI + 1) { fate = 'orbit'; break; }
    }
    var defl = 0;
    if (fate !== 'capture') defl = (phi - (Math.PI - Math.asin(Math.min(1, b / RFAR)))) * 180 / Math.PI;
    var cls = fate === 'capture' ? 0 : (defl >= 90 || fate === 'orbit' ? 1 : 2);
    return { pts: pts, fate: fate, defl: defl, cls: cls };
  }
  function rotated(pts, psi) {
    var c = Math.cos(psi), s = Math.sin(psi);
    return pts.map(function (p) { return new THREE.Vector3(p.x, p.y * c, p.y * s); });
  }
  var CLS_COLOR = [0xff5a5a, 0xffc44d, 0x7de8ff];

  /* ---------- ray groups with moving beads ---------- */
  var BEADS = 4, BSPEED = 7;
  function makeGroup() {
    var g = new THREE.Group();
    rayWorld.add(g);
    return { obj: g, rays: [], beads: null };
  }
  function clearGroup(G) {
    for (var i = G.obj.children.length - 1; i >= 0; i--) {
      var c = G.obj.children[i];
      G.obj.remove(c);
      if (c.geometry) c.geometry.dispose();
    }
    G.rays = []; G.beads = null;
  }
  function setRays(G, defs) {
    clearGroup(G);
    defs.forEach(function (d) {
      var n = d.pts.length;
      if (n < 2) return;
      var arr = new Float32Array(n * 3), cum = new Float32Array(n);
      for (var i = 0; i < n; i++) {
        arr[i * 3] = d.pts[i].x; arr[i * 3 + 1] = d.pts[i].y; arr[i * 3 + 2] = d.pts[i].z;
        if (i > 0) cum[i] = cum[i - 1] + d.pts[i].distanceTo(d.pts[i - 1]);
      }
      var geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      var line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: d.color, transparent: true, opacity: d.opacity || 0.55 }));
      G.obj.add(line);
      var cc = new THREE.Color(d.color);
      G.rays.push({ arr: arr, cum: cum, n: n, total: cum[n - 1], col: [cc.r, cc.g, cc.b] });
    });
    var cnt = G.rays.length * BEADS;
    var pos = new Float32Array(cnt * 3), col = new Float32Array(cnt * 3);
    var bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    bg.setAttribute('color', new THREE.BufferAttribute(col, 3));
    var pts = new THREE.Points(bg, new THREE.PointsMaterial({
      size: 0.42, vertexColors: true, map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    pts.frustumCulled = false;
    G.obj.add(pts);
    G.beads = { pts: pts, pos: pos, col: col };
  }
  function updateBeads(G, time) {
    if (!G.beads) return;
    var pos = G.beads.pos, col = G.beads.col, idx = 0;
    for (var r = 0; r < G.rays.length; r++) {
      var ray = G.rays[r];
      for (var j = 0; j < BEADS; j++) {
        var s = (time * BSPEED + j * ray.total / BEADS) % ray.total;
        var k = 1;
        while (k < ray.n - 1 && ray.cum[k] < s) k++;
        var seg = ray.cum[k] - ray.cum[k - 1] || 1;
        var f = (s - ray.cum[k - 1]) / seg;
        pos[idx * 3] = ray.arr[(k - 1) * 3] + (ray.arr[k * 3] - ray.arr[(k - 1) * 3]) * f;
        pos[idx * 3 + 1] = ray.arr[(k - 1) * 3 + 1] + (ray.arr[k * 3 + 1] - ray.arr[(k - 1) * 3 + 1]) * f;
        pos[idx * 3 + 2] = ray.arr[(k - 1) * 3 + 2] + (ray.arr[k * 3 + 2] - ray.arr[(k - 1) * 3 + 2]) * f;
        col[idx * 3] = ray.col[0]; col[idx * 3 + 1] = ray.col[1]; col[idx * 3 + 2] = ray.col[2];
        idx++;
      }
    }
    G.beads.pts.geometry.attributes.position.needsUpdate = true;
    G.beads.pts.geometry.attributes.color.needsUpdate = true;
  }

  var gA = makeGroup(), gB = makeGroup(), g3 = makeGroup(), g4 = makeGroup();

  /* step 1: bundle at several distances, rotated around the line of sight */
  (function () {
    var bs = [3.3, 4.3, 5.6, 7.2], cols = [0xffb347, 0xffe08a, 0x7de8ff, 0x9fb0ff], defs = [];
    bs.forEach(function (b, i) {
      var t = trace(b);
      for (var p = 0; p < 8; p++) defs.push({ pts: rotated(t.pts, p * TAU / 8), color: cols[i], opacity: 0.5 });
    });
    setRays(gA, defs);
  })();

  /* step 2: close approaches with fates */
  (function () {
    var bs = [1.6, 2.2, 2.5, 2.66, 2.85, 3.3], defs = [];
    bs.forEach(function (b) {
      var t = trace(b);
      for (var p = 0; p < 5; p++) defs.push({ pts: rotated(t.pts, p * TAU / 5 + 0.3), color: CLS_COLOR[t.cls], opacity: 0.6 });
    });
    setRays(gB, defs);
  })();

  /* step 3: one aimed ray plus straight reference */
  var bImpact = 4.0, ray3 = null, ref3 = null;
  function rebuild3() {
    var t = trace(bImpact);
    ray3 = t;
    setRays(g3, [{ pts: rotated(t.pts, 0.5), color: CLS_COLOR[t.cls], opacity: 0.95 }]);
    if (ref3) { g3.obj.remove(ref3); ref3.geometry.dispose(); }
    var y = bImpact * Math.cos(0.5), z = bImpact * Math.sin(0.5);
    var rg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-RFAR, y, z), new THREE.Vector3(RFAR, y, z)]);
    ref3 = new THREE.Line(rg, new THREE.LineDashedMaterial({ color: 0x9fb0e8, dashSize: 0.5, gapSize: 0.4, transparent: true, opacity: 0.6 }));
    ref3.computeLineDistances();
    g3.obj.add(ref3);
    updateStatus();
  }

  /* step 4: gravitational lens (thin-lens geometry) */
  var lensH = Math.sqrt(RFAR * 1.0);
  (function () {
    var defs = [];
    for (var p = 0; p < 20; p++) {
      var psi = p * TAU / 20, pts = [];
      for (var i = 0; i <= 40; i++) {
        var t = i / 40, x = -RFAR + 2 * RFAR * t, rho = 4 * lensH * t * (1 - t);
        pts.push(new THREE.Vector3(x, rho * Math.cos(psi), rho * Math.sin(psi)));
      }
      defs.push({ pts: pts, color: 0xffe08a, opacity: 0.45 });
    }
    setRays(g4, defs);
    var ringGeo = new THREE.TorusGeometry(lensH, 0.09, 10, 110);
    ringGeo.rotateY(Math.PI / 2);
    var ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
    g4.obj.add(ring);
    var star = new THREE.Group();
    star.add(new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 16), new THREE.MeshBasicMaterial({ color: 0xfff1b8 })));
    star.add(new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false })));
    star.position.set(-RFAR, 0, 0);
    var eye = new THREE.Group();
    eye.add(new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff })));
    eye.add(new THREE.Mesh(new THREE.SphereGeometry(1.0, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false })));
    eye.position.set(RFAR, 0, 0);
    g4.obj.add(star, eye);
  })();

  /* ---------- black hole ---------- */
  var hole = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
  var rim = new THREE.Mesh(new THREE.SphereGeometry(1.14, 32, 32), new THREE.MeshBasicMaterial({
    color: 0xff9a3d, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide
  }));
  var diskIn = new THREE.Mesh(new THREE.RingGeometry(1.5, 2.3, 80, 1), new THREE.MeshBasicMaterial({
    color: 0xffb347, transparent: true, opacity: 0.8, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  var diskOut = new THREE.Mesh(new THREE.RingGeometry(2.3, 3.6, 80, 1), new THREE.MeshBasicMaterial({
    color: 0xff6b2d, transparent: true, opacity: 0.32, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  var disk = new THREE.Group();
  diskIn.rotation.x = diskOut.rotation.x = -Math.PI / 2;
  disk.add(diskIn, diskOut);
  disk.rotation.z = 0.25;
  var photonSphere = new THREE.Mesh(new THREE.SphereGeometry(1.5, 24, 16), new THREE.MeshBasicMaterial({
    color: 0xffc44d, wireframe: true, transparent: true, opacity: 0.35
  }));
  holeGroup.add(hole, rim, disk, photonSphere);

  /* ---------- spacetime sheet ---------- */
  var mass = 1.4;
  var GN = 25, GS = 49, GX = 12;
  var gridBase = [];
  var gridGeo = new THREE.BufferGeometry();
  var gridPos = new Float32Array(2 * GN * (GS - 1) * 2 * 3);
  (function () {
    var n = 0;
    for (var dir = 0; dir < 2; dir++) {
      for (var li = 0; li < GN; li++) {
        var fixed = -GX + 2 * GX * li / (GN - 1);
        for (var si = 0; si < GS - 1; si++) {
          var a = -GX + 2 * GX * si / (GS - 1), b2 = -GX + 2 * GX * (si + 1) / (GS - 1);
          if (dir === 0) { gridBase.push(a, fixed, b2, fixed); } else { gridBase.push(fixed, a, fixed, b2); }
          n++;
        }
      }
    }
  })();
  function depthFn(r) { return mass * 2.0 / Math.sqrt(r * r + 1.5); }
  function updateGrid() {
    var k = 0, i;
    for (i = 0; i < gridBase.length; i += 4) {
      var x1, z1, x2, z2;
      x1 = gridBase[i]; z1 = gridBase[i + 1]; x2 = gridBase[i + 2]; z2 = gridBase[i + 3];
      gridPos[k++] = x1; gridPos[k++] = -depthFn(Math.hypot(x1, z1)); gridPos[k++] = z1;
      gridPos[k++] = x2; gridPos[k++] = -depthFn(Math.hypot(x2, z2)); gridPos[k++] = z2;
    }
    gridGeo.attributes.position.needsUpdate = true;
  }
  gridGeo.setAttribute('position', new THREE.BufferAttribute(gridPos, 3));
  var gridLines = new THREE.LineSegments(gridGeo, new THREE.LineBasicMaterial({ color: 0x35c2ab, transparent: true, opacity: 0.55 }));
  gridLines.frustumCulled = false;
  gridGroup.add(gridLines);
  var marble = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 14), new THREE.MeshBasicMaterial({ color: 0xffc44d }));
  gridGroup.add(marble);
  updateGrid();

  /* ---------- state, UI ---------- */
  var step = 0, time = 0;
  for (var di = 0; di < TEXTS.length; di++) dotsEl.appendChild(document.createElement('i'));

  function wellSvg() {
    var pts = '';
    for (var x = 6; x <= 114; x += 4) {
      var r = (x - 60) / 9;
      var y = 12 + depthFn(r) * 11;
      pts += x + ',' + y.toFixed(1) + ' ';
    }
    var yc = 12 + depthFn(0) * 11;
    var rm = 4.2, xm = 60 + rm * 9, ym = 12 + depthFn(rm) * 11;
    return '<polyline points="' + pts + '" fill="none" stroke="#35c2ab" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<circle cx="60" cy="' + (yc - 4).toFixed(1) + '" r="6.5" fill="#000" stroke="#ff9a3d" stroke-width="2"/>' +
      '<circle cx="' + xm + '" cy="' + (ym - 3.5).toFixed(1) + '" r="3.2" fill="#ffc44d"/>';
  }
  function diagram() {
    var s = '';
    if (step === 0) {
      s = '<g id="well">' + wellSvg() + '</g>';
    } else if (step === 1) {
      s = '<line x1="6" y1="26" x2="114" y2="26" stroke="#9fb0e8" stroke-width="2" stroke-dasharray="5 4"/>' +
        '<path d="M6 26H36C62 26 78 34 88 50S104 72 114 74" fill="none" stroke="#ffe08a" stroke-width="3" stroke-linecap="round"/>' +
        '<circle cx="60" cy="58" r="8" fill="#000" stroke="#ff9a3d" stroke-width="2.2"/>';
    } else if (step === 2) {
      s = '<circle cx="60" cy="44" r="15" fill="none" stroke="#ffc44d" stroke-width="1.4" stroke-dasharray="3 3"/>' +
        '<circle cx="60" cy="44" r="8" fill="#000" stroke="#ff9a3d" stroke-width="2"/>' +
        '<path d="M6 46H44Q52 46 55 44" fill="none" stroke="#ff5a5a" stroke-width="3" stroke-linecap="round"/>' +
        '<path d="M6 60H40Q64 60 66 52 74 26 52 26 40 30 56 34" fill="none" stroke="#ffc44d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<path d="M6 12H50Q86 12 114 26" fill="none" stroke="#7de8ff" stroke-width="3" stroke-linecap="round"/>';
    } else if (step === 3) {
      var names = ['נבלעת', 'מקיפה', 'בורחת'];
      for (var i = 0; i < 3; i++) {
        var ox = i * 40;
        s += '<rect id="p' + i + '" x="' + (ox + 3) + '" y="6" width="34" height="56" rx="7" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.2)" stroke-width="2"/>';
        s += '<text x="' + (ox + 20) + '" y="78" text-anchor="middle" font-size="10" fill="#eef2ff">' + names[i] + '</text>';
      }
      s += '<circle cx="20" cy="38" r="4" fill="#000" stroke="#ff9a3d" stroke-width="1.5"/><path d="M8 18Q18 20 19 35" fill="none" stroke="#ff5a5a" stroke-width="2.4" stroke-linecap="round"/>';
      s += '<circle cx="60" cy="38" r="4" fill="#000" stroke="#ff9a3d" stroke-width="1.5"/><path d="M46 16Q62 14 66 26A9 9 0 1 1 55 32" fill="none" stroke="#ffc44d" stroke-width="2.4" stroke-linecap="round"/>';
      s += '<circle cx="100" cy="42" r="4" fill="#000" stroke="#ff9a3d" stroke-width="1.5"/><path d="M86 16Q100 18 104 30T112 52" fill="none" stroke="#7de8ff" stroke-width="2.4" stroke-linecap="round"/>';
    } else {
      s = '<circle cx="60" cy="38" r="26" fill="none" stroke="#ffe08a" stroke-width="4" opacity=".9"/>' +
        '<circle cx="60" cy="38" r="26" fill="none" stroke="#ffe08a" stroke-width="10" opacity=".18"/>' +
        '<circle cx="60" cy="38" r="12" fill="#000" stroke="#ff9a3d" stroke-width="2"/>' +
        '<text x="60" y="80" text-anchor="middle" font-size="10" fill="#eef2ff">מה שהצופה רואה</text>';
    }
    diagramEl.innerHTML = '<svg viewBox="0 0 120 84" role="img" aria-label="שרטוט לשלב ' + (step + 1) + '">' + s + '</svg>';
  }

  function updateStatus() {
    if (step !== 3 || !ray3) return;
    var big = document.getElementById('v3'), sm = document.getElementById('s3');
    if (big) big.textContent = ray3.cls === 0 ? 'נבלעת' : 'סטייה ' + Math.round(ray3.defl) + '°';
    var names = ['הקרן נופלת לחור השחור ולא חוזרת.', 'הקרן מקיפה את החור השחור ואז בורחת.', 'הקרן בורחת, אבל המסלול שלה מתעקם.'];
    if (sm) sm.textContent = names[ray3.cls];
    for (var i = 0; i < 3; i++) {
      var p = document.getElementById('p' + i);
      if (p) p.setAttribute('stroke', i === ray3.cls ? '#ffc44d' : 'rgba(255,255,255,.2)');
    }
  }

  function info() {
    var h = '';
    if (step === 0) h = '<div class="big" id="v0">מסה ×' + mass.toFixed(1) + '</div><div>עומק הבור בשרטוט גדל עם המסה. הכדור הצהוב מסתובב בתוכו.</div>';
    else if (step === 1) h = '<div class="row"><span class="dash"></span><span>מסלול ישר, בלי חור שחור</span></div><div class="row"><span class="solid" style="border-color:#ffe08a"></span><span>המסלול האמיתי, מתעקם</span></div>';
    else if (step === 2) h = '<div class="row"><span class="chip" style="background:#ff5a5a"></span><span>נבלעת</span></div><div class="row"><span class="chip" style="background:#ffc44d"></span><span>מקיפה ובורחת</span></div><div class="row"><span class="chip" style="background:#7de8ff"></span><span>בורחת ומתעקמת</span></div>';
    else if (step === 3) h = '<div class="big" id="v3"></div><div id="s3"></div>';
    else h = '<div class="row"><span class="solid" style="border-color:#ffe08a"></span><span>קרני האור מהכוכב</span></div><div>קרניים מכל הצדדים מתעקמות ומתכנסות אל העין. לכן רואים טבעת ולא נקודה.</div>';
    infoEl.innerHTML = h;
  }

  function setStep(n) {
    step = Math.max(0, Math.min(TEXTS.length - 1, n));
    capEl.textContent = TEXTS[step];
    Array.prototype.forEach.call(dotsEl.children, function (d, i) { d.className = i === step ? 'on' : (i < step ? 'done' : ''); });
    prevBtn.disabled = step === 0;
    nextBtn.disabled = step === TEXTS.length - 1;

    gridGroup.visible = step === 0;
    gA.obj.visible = step === 1;
    gB.obj.visible = step === 2;
    g3.obj.visible = step === 3;
    g4.obj.visible = step === 4;
    photonSphere.visible = step === 2 || step === 3;
    disk.visible = step !== 0;
    holeGroup.position.y = step === 0 ? -depthFn(0) : 0;
    holeGroup.scale.setScalar(step === 0 ? 0.6 : 1);

    var hasSlider = step === 0 || step === 3;
    slideWrap.hidden = !hasSlider;
    slideLabel.hidden = !hasSlider;
    if (step === 0) {
      slider.min = '0.3'; slider.max = '3'; slider.step = '0.05'; slider.value = String(mass);
      sl0.textContent = 'קלה'; sl1.textContent = 'כבדה';
      slideLabel.textContent = 'מסת החור השחור: גררו כדי לשנות';
    } else if (step === 3) {
      slider.min = '1.5'; slider.max = '8'; slider.step = '0.01'; slider.value = String(bImpact);
      sl0.textContent = 'קרוב'; sl1.textContent = 'רחוק';
      slideLabel.textContent = 'כמה קרוב הקרן עוברת לחור השחור';
    }

    labelEls[1].hidden = step !== 4;
    labelEls[2].hidden = step !== 4;
    labelEls[3].hidden = !(step >= 1 && step <= 3);
    labelEls[4].hidden = step !== 0;

    diagram();
    info();
    if (step === 3) rebuild3();
    layout();
  }
  prevBtn.addEventListener('click', function () { setStep(step - 1); });
  nextBtn.addEventListener('click', function () { setStep(step + 1); });
  slider.addEventListener('input', function () {
    var v = parseFloat(slider.value);
    if (step === 0) {
      mass = v;
      updateGrid();
      holeGroup.position.y = -depthFn(0);
      var w = document.getElementById('well'); if (w) w.innerHTML = wellSvg();
      var m0 = document.getElementById('v0'); if (m0) m0.textContent = 'מסה ×' + mass.toFixed(1);
    } else if (step === 3) {
      bImpact = v;
      rebuild3();
    }
  });

  /* layout */
  var zoom = 1;
  function layout() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    var aspect = w / h;
    var portrait = aspect < 1.05;
    rayWorld.rotation.z = portrait ? -Math.PI / 2 : 0;
    var half = Math.tan(22.5 * Math.PI / 180);
    var dist = portrait ? 62 : Math.max(26, 32 / (2 * half * Math.min(aspect, 1.8)));
    dist = dist / zoom;
    camera.position.set(0, 0, dist);
    camera.lookAt(0, 0, 0);
    var visibleH = 2 * half * dist;
    var sheetH = sheet.getBoundingClientRect().height;
    root.position.y = (sheetH / h) * visibleH * 0.5 - 0.03 * visibleH;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', layout);

  /* input */
  var pointers = {}, pinchStart = 0, zoomStart = 1, lastInteract = 0;
  var userY = -0.3, userX = 0.3;
  function pDist() {
    var ks = Object.keys(pointers);
    var p1 = pointers[ks[0]], p2 = pointers[ks[1]];
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }
  canvas.addEventListener('pointerdown', function (e) {
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    if (Object.keys(pointers).length === 2) { pinchStart = pDist(); zoomStart = zoom; }
    lastInteract = performance.now();
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    lastInteract = performance.now();
    var n = Object.keys(pointers).length;
    if (n === 1) {
      userY += dx * 0.008;
      userX = Math.max(-1.2, Math.min(1.4, userX + dy * 0.006));
    } else if (n >= 2 && pinchStart > 0) {
      zoom = Math.max(0.6, Math.min(2.4, zoomStart * pDist() / pinchStart));
      layout();
    }
  });
  function up(e) {
    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) pinchStart = 0;
    lastInteract = performance.now();
  }
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoom = Math.max(0.6, Math.min(2.4, zoom * (e.deltaY < 0 ? 1.08 : 0.92)));
    layout();
  }, { passive: false });

  /* labels */
  var v3 = new THREE.Vector3();
  function place(lbl, parent, x, y, z) {
    if (lbl.hidden) return;
    v3.set(x, y, z);
    parent.localToWorld(v3);
    v3.project(camera);
    var px = (v3.x * 0.5 + 0.5) * window.innerWidth;
    var py = (-v3.y * 0.5 + 0.5) * window.innerHeight;
    var w = lbl.offsetWidth;
    px = Math.max(6, Math.min(window.innerWidth - w - 6, px - w / 2));
    lbl.style.transform = 'translate(' + px + 'px,' + py + 'px) translateY(-100%)';
  }

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var last = performance.now() / 1000;
  function frame(t) {
    requestAnimationFrame(frame);
    var now = t / 1000;
    var dt = Math.min(0.05, Math.max(0.001, now - last));
    last = now; time += dt;

    if (step === 0) {
      var ang = time * 0.9 * Math.sqrt(mass);
      var rm = 4.2;
      marble.position.set(rm * Math.cos(ang), -depthFn(rm) + 0.3, rm * Math.sin(ang));
    }
    if (step === 1) updateBeads(gA, time);
    if (step === 2) updateBeads(gB, time);
    if (step === 3) updateBeads(g3, time);
    if (step === 4) updateBeads(g4, time);

    disk.rotation.y += dt * 0.6;
    var idle = performance.now() - lastInteract > 2500 && Object.keys(pointers).length === 0;
    root.rotation.y = userY + (idle && !reduce ? Math.sin(time * 0.3) * 0.12 : 0);
    root.rotation.x = userX;

    scene.updateMatrixWorld(true);
    camera.updateMatrixWorld(true);
    var hy = step === 0 ? holeGroup.position.y : 0;
    place(labelEls[0], holeGroup, 0, step === 0 ? 2.2 : 2.4, 0);
    place(labelEls[1], rayWorld, -RFAR, 1.6, 0);
    place(labelEls[2], rayWorld, RFAR, 1.6, 0);
    place(labelEls[3], rayWorld, -RFAR + 1, bImpact > 0 && step === 3 ? bImpact * Math.cos(0.5) + 1.2 : 5.2, 0);
    place(labelEls[4], gridGroup, -GX + 4, -depthFn(GX) + 0.8, GX);

    renderer.render(scene, camera);
  }

  setStep(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<meta name="claude:viewport-fit-sides" content="cover">
<title>מחיקה בשבעה שלבים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=Heebo:wght@400;500&display=swap">
<style>
:root {
  --paper: #F4EFE6; --surface: #FBF8F2; --ink: #1E1A14; --muted: #6B6257; --rule: #D8CFBF;
  --accent: #B5532A; --sage: #4F7A66;
  --font-display: "Frank Ruhl Libre", serif; --font-body: "Heebo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16130F; --surface: #1E1A14; --ink: #EDE6DA; --muted: #A39A8C; --rule: #3A342B;
    --accent: #E07A4F; --sage: #7FAE95; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16130F; --surface: #1E1A14; --ink: #EDE6DA; --muted: #A39A8C; --rule: #3A342B;
  --accent: #E07A4F; --sage: #7FAE95; color-scheme: dark;
}
html, body { height: 100%; }
body {
  box-sizing: border-box; height: 100%; margin: 0; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { height: 100%; max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
h1 { margin: 0; font-family: var(--font-display); font-size: 1.5rem; line-height: 1.2; }
.stage {
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  border: 1px solid var(--rule); background: var(--surface); padding: 10px 12px;
}
.stage-head { display: flex; justify-content: space-between; align-items: baseline; flex: 0 0 auto; }
.stage-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; }
.count { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
#art { flex: 1 1 auto; min-height: 0; width: 100%; height: 100%; display: block; }
.legend {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px;
  font-size: 0.8rem; color: var(--muted); flex: 0 0 auto;
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }
.k-photo { background: var(--accent); }
.k-doc { background: var(--sage); }
.k-faded { background: color-mix(in srgb, var(--accent) 22%, transparent); border: 1px dashed var(--accent); box-sizing: border-box; }
.k-new { background: var(--ink); }
.k-zero { background-color: var(--paper); background-image: radial-gradient(var(--muted) 1px, transparent 1px); background-size: 4px 4px; border: 1px solid var(--rule); box-sizing: border-box; }
.caption { margin: 0; flex: 0 0 auto; min-height: 4.6em; font-size: 1rem; line-height: 1.55; text-align: center; }
.dots { display: flex; gap: 7px; justify-content: center; flex: 0 0 auto; }
.dots i { display: block; width: 8px; height: 8px; border-radius: 4px; background: var(--rule); }
.dots i.on { width: 22px; background: var(--accent); }
.nav { display: flex; gap: 10px; flex: 0 0 auto; }
.nav button {
  flex: 1; min-height: 50px; font: inherit; font-weight: 500; font-size: 1rem;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer;
}
.nav button:disabled { opacity: 0.35; cursor: default; }
.nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div class="app" dir="rtl" lang="he">
  <h1>מחיקה בשבעה שלבים</h1>

  <section class="stage">
    <div class="stage-head">
      <h2 id="stepTitle"></h2>
      <span class="count" id="count"></span>
    </div>
    <svg id="art" viewBox="0 0 320 260" role="img" preserveAspectRatio="xMidYMid meet"></svg>
  </section>

  <div class="legend" aria-hidden="true">
    <span><i class="k-photo"></i>התמונה</span>
    <span><i class="k-doc"></i>מסמך</span>
    <span><i class="k-faded"></i>נמחקה, התוכן עדיין שם</span>
    <span><i class="k-new"></i>קובץ חדש</span>
    <span><i class="k-zero"></i>אפסים</span>
  </div>

  <p class="caption" id="caption" aria-live="polite"></p>
  <div class="dots" id="dots" aria-hidden="true"></div>

  <nav class="nav">
    <button id="prev" type="button">הקודם</button>
    <button id="next" type="button">הבא</button>
  </nav>
</div>

<script>
(function () {
  var TOTAL = 48;
  var PHOTO = [2, 3, 4, 5, 10, 11, 12, 13, 20, 21, 22, 23];
  var DOC = [30, 31, 32, 38, 39, 40];
  /* New file: 5 blocks from free space and 5 from the old photo, scattered. */
  var NEW_BLOCKS = [7, 16, 26, 35, 44, 3, 12, 21, 5, 13];
  /* Photo pieces in file order (4 columns x 3 rows) and which were overwritten. */
  var PIECE_KIND = ['sky', 'sky', 'sky', 'sun', 'sea', 'sea', 'sea', 'sea', 'sea', 'sea', 'sand', 'sand'];
  var OVERWRITTEN = [1, 3, 6, 7, 9];

  var STEPS = [
    { title: 'הקובץ', caption: 'כל קובץ נשמר בבלוקים קטנים. הם לא תמיד צמודים זה לזה, והם יכולים להיות בכל מקום בדיסק.' },
    { title: 'הרשומה', caption: 'הרשומה היא המפה: היא יודעת איפה כל בלוק נמצא. בלי הרשומה, המחשב לא יודע שהבלוקים האלה שייכים לקובץ.' },
    { title: 'מחיקה', caption: 'כשמוחקים, נמחקת הרשומה בלבד. הבלוקים לא נוגעים בהם, והמערכת רק מסמנת אותם כפנויים.' },
    { title: 'שחזור אפשרי', caption: 'כל עוד אף קובץ לא נכתב על הבלוקים, התוכן שלהם שלם. אפשר לקרוא אותם ולהרכיב את התמונה מחדש.' },
    { title: 'קובץ חדש', caption: 'שמירת קובץ חדש כותבת על בלוקים פנויים. כשהפנויים נגמרים, היא כותבת גם על בלוקים ישנים. כאן נדרסו 5 בלוקים של התמונה.' },
    { title: 'שחזור חלקי', caption: 'מהתמונה נשארו 7 בלוקים מתוך 12. השחזור יביא תמונה עם חורים, ולא את התמונה המלאה.' },
    { title: 'מחיקה אמיתית', caption: 'כדי שהמידע באמת ייעלם: לכתוב אפסים על הבלוקים, או להצפין את הדיסק ולמחוק את המפתח.' }
  ];

  var cur = 0;
  var art = document.getElementById('art');
  var dotsEl = document.getElementById('dots');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');

  for (var d = 0; d < STEPS.length; d++) dotsEl.appendChild(document.createElement('i'));

  function cellXY(i) { return { x: 52 + (i % 8) * 28, y: 84 + Math.floor(i / 8) * 26 }; }

  var STYLE = {
    free:   'fill:var(--surface);stroke:var(--rule);stroke-width:1',
    photo:  'fill:var(--accent)',
    doc:    'fill:var(--sage)',
    faded:  'fill:var(--accent);fill-opacity:0.22;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 2',
    newf:   'fill:var(--ink)',
    zero:   'fill:url(#dots);stroke:var(--rule);stroke-width:1'
  };

  function states(step) {
    var st = [], i;
    for (i = 0; i < TOTAL; i++) st.push('free');
    DOC.forEach(function (k) { st[k] = 'doc'; });
    PHOTO.forEach(function (k) { st[k] = 'photo'; });
    if (step >= 2 && step <= 5) PHOTO.forEach(function (k) { st[k] = 'faded'; });
    if (step === 4 || step === 5) NEW_BLOCKS.forEach(function (k) { st[k] = 'newf'; });
    if (step === 6) {
      for (i = 0; i < TOTAL; i++) if (st[i] === 'free' || st[i] === 'faded' || st[i] === 'photo') st[i] = 'zero';
    }
    return st;
  }

  function text(x, y, size, weight, fill, str) {
    return '<text x="' + x + '" y="' + y + '" text-anchor="middle" style="font-family:var(--font-body);font-size:' +
      size + 'px;font-weight:' + weight + ';fill:' + fill + '">' + str + '</text>';
  }

  function fileCard(step) {
    var deleted = step === 2;
    var label = step === 4 ? 'קובץ חדש' : 'חוף-בבוקר.jpg';
    var meta = step === 0 ? '12 בלוקים' : step === 1 ? '12 בלוקים, מיקום בכל הדיסק' : step === 2 ? 'הרשומה נמחקה' : '10 בלוקים';
    var out = '<rect x="70" y="14" width="180" height="46" rx="6" style="fill:var(--surface);stroke:' +
      (deleted ? 'var(--accent)' : 'var(--ink)') + ';stroke-width:1' + (deleted ? ';stroke-dasharray:4 3' : '') + '"/>';
    out += text(160, 34, 14, 500, deleted ? 'var(--muted)' : 'var(--ink)', label);
    if (deleted) out += '<line x1="108" y1="30" x2="212" y2="30" style="stroke:var(--accent);stroke-width:1.5"/>';
    out += text(160, 51, 11, 400, deleted ? 'var(--accent)' : 'var(--muted)', meta);
    return out;
  }

  function arrows() {
    var s = 'style="stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3"';
    return '<line x1="100" y1="60" x2="119" y2="84" ' + s + '/>' +
           '<line x1="140" y1="60" x2="119" y2="119" ' + s + '/>' +
           '<line x1="220" y1="60" x2="175" y2="146" ' + s + '/>';
  }

  function thumbnail(partial) {
    var out = '';
    for (var k = 0; k < 12; k++) {
      var x = 125 + (k % 4) * 18, y = 24 + Math.floor(k / 4) * 13;
      var missing = partial && OVERWRITTEN.indexOf(k) > -1;
      var s;
      if (missing) s = 'fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2';
      else if (PIECE_KIND[k] === 'sky') s = 'fill:var(--muted);fill-opacity:0.3';
      else if (PIECE_KIND[k] === 'sun') s = 'fill:var(--accent)';
      else if (PIECE_KIND[k] === 'sea') s = 'fill:var(--ink);fill-opacity:0.55';
      else s = 'fill:var(--rule);stroke:var(--muted);stroke-width:0.5';
      out += '<rect x="' + x + '" y="' + y + '" width="16" height="11" rx="1" style="' + s + '"/>';
    }
    return out;
  }

  function topArea(step) {
    if (step === 3) return text(160, 16, 11, 500, 'var(--ink)', 'התמונה, מורכבת מחדש מ-12 בלוקים') + thumbnail(false);
    if (step === 5) return text(160, 16, 11, 500, 'var(--ink)', 'מה שחזר: 7 מתוך 12 בלוקים') + thumbnail(true);
    if (step === 6) {
      return '<rect x="50" y="18" width="100" height="36" rx="6" style="fill:var(--surface);stroke:var(--ink)"/>' +
             text(100, 40, 12, 500, 'var(--ink)', 'כתיבת אפסים') +
             '<rect x="170" y="18" width="100" height="36" rx="6" style="fill:var(--surface);stroke:var(--ink)"/>' +
             text(220, 40, 12, 500, 'var(--ink)', 'מחיקת המפתח');
    }
    return fileCard(step);
  }

  function svgFor(step) {
    var st = states(step);
    var out = '<title>' + STEPS[step].title + '</title>' +
      '<defs><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">' +
      '<circle cx="3" cy="3" r="1" style="fill:var(--muted)"/></pattern></defs>' +
      '<rect x="40" y="72" width="240" height="176" rx="6" style="fill:var(--paper);stroke:var(--ink)" stroke-width="1"/>';
    for (var i = 0; i < TOTAL; i++) {
      var c = i % 8, r = Math.floor(i / 8);
      out += '<rect x="' + (52 + c * 28) + '" y="' + (84 + r * 26) + '" width="22" height="19" rx="3" style="' + STYLE[st[i]] + '"/>';
    }
    out += topArea(step);
    if (step === 1) out += arrows();
    return out;
  }

  function render() {
    document.getElementById('count').textContent = (cur + 1) + ' / ' + STEPS.length;
    document.getElementById('stepTitle').textContent = STEPS[cur].title;
    document.getElementById('caption').textContent = STEPS[cur].caption;
    art.setAttribute('aria-label', STEPS[cur].title);
    art.innerHTML = svgFor(cur);
    for (var k = 0; k < dotsEl.children.length; k++) dotsEl.children[k].className = k === cur ? 'on' : '';
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === STEPS.length - 1;
  }

  prevBtn.addEventListener('click', function () { if (cur > 0) { cur--; render(); } });
  nextBtn.addEventListener('click', function () { if (cur < STEPS.length - 1) { cur++; render(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' && cur < STEPS.length - 1) { cur++; render(); }
    if (e.key === 'ArrowRight' && cur > 0) { cur--; render(); }
  });

  render();
})();
</script>
